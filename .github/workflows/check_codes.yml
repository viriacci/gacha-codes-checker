name: Check game codes
on:
  schedule:
    - cron: "0 7,11,15,19,23 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:
    inputs:
      game:
        description: Optional game key
        type: choice
        options: ["all", "genshin", "zzz", "hsr", "wuwa", "nte"]
        default: all
      dry_run:
        description: Check without sending or saving
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: gacha-codes
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Run scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GAME: ${{ inputs.game || 'all' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=()
          if [ "$GAME" != all ]; then args+=(--game "$GAME"); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python scraper.py "${args[@]}"
      - name: Commit updated state
        if: always() && !cancelled()
        run: |
          git config user.name "code-checker-bot"
          git config user.email "actions@github.com"
          git add seen_codes.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update seen codes [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
